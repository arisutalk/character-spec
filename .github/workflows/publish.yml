name: NPM Publish on Tag

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # ✅ OIDC 토큰 발급을 위해 이 권한이 필요합니다!
            id-token: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  package_json_file: "package.json"
                  run_install: false

            # Node 24 bundles npm 11.5.1 or later, which OIDC trusted publishing requires.
            # Installing npm@latest instead would pull in an untested major version.
            - name: Setup Node.js (Trusted Publishing OIDC)
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
                  # No dependency cache: a poisoned cache could read the OIDC token.
                  package-manager-cache: false

            - name: Check npm version
              run: npm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `pnpm test` builds the package first, then runs the type and unit tests.
            - name: Build and test package
              run: pnpm test

            - name: Publish to NPM (OIDC)
              run: npm publish
